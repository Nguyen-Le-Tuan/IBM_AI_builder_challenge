<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Inline Evidence Highlights logo">
  <!-- Flat, no gradients. Full-bleed background so Discord's circular crop stays clean. -->
  <rect width="512" height="512" fill="#1F2A44"/>
  <!-- Post card -->
  <rect x="96" y="120" width="320" height="244" rx="40" fill="#FFFFFF"/>
  <!-- Text lines; the middle one carries an amber "changed" highlight -->
  <rect x="140" y="170" width="232" height="24" rx="12" fill="#D9DEE6"/>
  <rect x="132" y="214" width="160" height="40" rx="10" fill="#F4C95D"/>
  <rect x="148" y="226" width="128" height="16" rx="8" fill="#8A5A00" opacity="0.55"/>
  <rect x="306" y="222" width="66" height="24" rx="12" fill="#D9DEE6"/>
  <rect x="140" y="274" width="150" height="24" rx="12" fill="#D9DEE6"/>
  <!-- Evidence bubble with a "differs" sign -->
  <circle cx="370" cy="356" r="78" fill="#1F2A44"/>
  <circle cx="370" cy="356" r="64" fill="#8E7CDB"/>
  <rect x="336" y="334" width="68" height="13" rx="6.5" fill="#FFFFFF"/>
  <rect x="336" y="365" width="68" height="13" rx="6.5" fill="#FFFFFF"/>
  <rect x="363" y="314" width="14" height="84" rx="7" fill="#FFFFFF" transform="rotate(28 370 356)"/>
</svg>
